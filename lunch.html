    <script>
        const lunch = meals.filter(meal => meal.category === 'Nudeln' || meal.category === 'Reis' || meal.category === 'Kartoffeln' || meal.category === 'Suppen' || meal.category === 'Sonstiges');
        const output = document.getElementById("output")

            if (!lunch) {
                console.log("Kein Frühstück verfügbar.")
            }
            else {
                output.innerHTML = lunch.map(meal => `
                    <h2>${meal.name}</h2>
                    <ul>${meal.ingredients.map(x => `<li>${x}</li>`).join("")}</ul>
                `).join("");
            }
