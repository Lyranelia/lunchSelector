<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="balken"></div>
        <h1>ADHEssen</h1>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Zufälliges Gericht</a></li>
                <li><a href="breakfast.html">Frühstück</a></li>
                <li><a href="lunch.html">Hauptmahlzeit</a></li>
                <li><a href="baked.html">Gebäck</a></li>
                <li><a href="snacks.html">Snacks</a></li>
                <li style="float:right"><a href="addMeal.html">Rezept hinzufügen</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form>
            <div>
                <label>Titel: </label>
                <input type="text" id="name">
            </div>
            
            <div class="dropdown" id="dropdown">
            <label>Kategorie: </label>
            <button type="button" onclick="showDropdown()" class="drpdwnBtn" id="drpdwnBtnAddMeal">Kategorie</button>
            
            <ul class="dropdownContent" id="dropdownContent" style="width: 18%;">
                <li><button type="button" onclick="selectCategory('Frühstück')">Frühstück</button></li>
                <li><button type="button" onclick="selectCategory('Snack')">Snack</button></li>
                <li><button type="button" onclick="selectCategory('Nudeln')">Hauptgericht: Nudeln</button></li>
                <li><button type="button" onclick="selectCategory('Reis')">Hauptgericht: Reis</button></li>
                <li><button type="button" onclick="selectCategory('Kartoffeln')">Hauptgericht: Kartoffeln</button></li>
                <li><button type="button" onclick="selectCategory('Suppen')">Hauptgericht: Suppen</button></li>
                <li><button type="button" onclick="selectCategory('Bohnen')">Hauptgericht: Bohnen</button></li>
                <li><button type="button" onclick="selectCategory('Sonstiges')">Hauptgericht: Sonstiges</button></li>
                <li><button type="button" onclick="selectCategory('Gebäck')">Gebäck</button></li>
            </ul>

            </div>
            
            <div>
                <label>Zutaten: (in Arbeit)</label>
                <!-- als Tabelle vielleicht -->
                <input type="text" id="ingredients">
            </div>
            <div>
                <button type="submit" onclick="" class="submitBtn">Rezept hinzufügen</button>
            </div>
        </form>
    </main>

    <footer>
        <a href="https://github.com/Lyranelia/"><img src="./src/GitHub Logo.png" width="2%" alt="GitHub Logo">: Lyranelia</a>
        <a href="https://lyranelia.itch.io/"><img src="./src/itchio logo.png" width="2%" alt="itch.io Logo">: Lyranelia</a>
        <div class="balken"></div>

    </footer>
    <script src="ADHEssenSelector.js"></script>
</body>
</html>
