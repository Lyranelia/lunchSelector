<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>ADHEssen Gerichtsauswahl</title>
</head>
<body>
    <header>
        <div class="balken"></div>
        <h1>ADHEssen</h1>
        <nav class="navbar">
            <ul>
                <li><a href="index.html" aria-current="page">Zufälliges Gericht</a></li>
                <li><a href="breakfast.html">Frühstück</a></li>
                <li><a href="lunch.html">Hauptmahlzeit</a></li>
                <li><a href="baked.html">Gebäck</a></li>
                <li><a href="snacks.html">Snacks</a></li>
                <li style="float:right"><a href="addMeal.html">Rezept hinzufügen</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Da ich scheinbar die hover-Option des Dropdownmenüs nicht stylen kann, muss ich eben ein eigenes bauen -->
        <div class="dropdown" id="dropdown">
            <p>Wähle deine gewünschte Kategorie: </p>
            <button onclick="showDropdown()" class="drpdwnBtn">Kategorie</button>
            <div>
                <ul class="dropdownContent" id="dropdownContent">
                    <li><button onclick="selectCategory('alle'); getRandomMeal('all');">alle</button></li>
                    <li><button onclick="selectCategory('Frühstück'); getRandomMeal('Frühstück')">Frühstück</button></li>
                    <li><button onclick="selectCategory('Hauptgericht'); getRandomMeal(['Nudeln', 'Reis', 'Kartoffeln', 'Suppen', 'Sonstiges'])">Hauptgericht</button></li>
                    <li><button onclick="selectCategory('Snack'); getRandomMeal('Snacks')">Snack</button></li>
                    <li><button onclick="selectCategory('Hauptgericht: Nudeln'); getRandomMeal('Nudeln')">Kategorie Nudeln</button></li>
                    <li><button onclick="selectCategory('Hauptgericht: Reis'); getRandomMeal('Reis')">Kategorie Reis</button></li>
                    <li><button onclick="selectCategory('Hauptgericht: Kartoffeln'); getRandomMeal('Kartoffeln')">Kategorie Kartoffeln</button></li>
                    <li><button onclick="selectCategory('Hauptgericht: Suppen'); getRandomMeal('Suppen')">Kategorie Suppen</button></li>
                    <li><button onclick="selectCategory('Hauptgericht: Sonstiges'); getRandomMeal('Sonstiges')">Kategorie Sonstiges</button></li>
                    <li><button onclick="selectCategory('Gebäck'); getRandomMeal('Gebäck')">Gebäck</button></li>
                </ul>
            </div>
        </div>

        <div class="output" id="output"></div>
    </main>

    <footer>
        <!-- <a href="https://github.com/Lyranelia/" target="_blank"><img src="./src/GitHub Logo.png" width="2%" alt="GitHub Logo"> Lyranelia</a>
        <a href="https://lyranelia.itch.io/" target="_blank"><img src="./src/itchio logo.png" width="2%" alt="itch.io Logo"> Lyranelia</a>
        <div class="balken"></div> -->
    </footer>
    <script src="ADHEssenSelector.js"></script>
</body>
</html>
